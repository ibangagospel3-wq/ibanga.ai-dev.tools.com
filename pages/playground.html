<!doctype html><html lang="en" data-page="playground"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Playground — IBANGA AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/editor.css"></head><body><div id="site-header"></div><main class="playground-shell"><div class="container"><div class="page-title" style="margin:0 0 25px;padding:30px;border-radius:18px"><span class="eyebrow">CODE PLAYGROUND</span><h1 style="font-size:clamp(2rem,4vw,3.3rem)">Build, run, <span class="gradient-text">see it.</span></h1><p>Write HTML, CSS and JavaScript together. Your preview updates in a sandboxed browser frame.</p></div><div class="playground-toolbar project-toolbar"><input id="project-name" class="search-box" value="My first IBANGA project" aria-label="Project name"><div class="editor-actions"><button id="save-code">Save</button><button id="copy-code">Copy</button><button id="download-code">Download</button><button id="reset-code">Reset</button><button id="clear-code">Clear</button><button id="ask-ai-code" class="btn-primary">Ask IBANGA AI ✦</button></div></div><div class="editor-workspace"><div class="editor-column"><div class="editor-tabs-live"><button class="editor-tab active" data-editor="html">HTML</button><button class="editor-tab" data-editor="css">CSS</button><button class="editor-tab" data-editor="js">JavaScript</button></div><textarea id="html-code" class="code-editor" data-editor="html" spellcheck="false" aria-label="HTML code"></textarea><textarea id="css-code" class="code-editor" data-editor="css" spellcheck="false" data-editor="css" hidden aria-label="CSS code"></textarea><textarea id="js-code" class="code-editor" data-editor="js" spellcheck="false" hidden aria-label="JavaScript code"></textarea><div class="editor-actions" style="margin-top:10px"><button id="run-code" class="run">▶ Run code <span class="kbd">Ctrl ↵</span></button></div></div><div class="preview-panel"><div class="preview-panel-head"><strong>Live Preview</strong><div><button id="refresh-preview" class="btn btn-small btn-secondary">↻ Refresh</button><button id="fullscreen-preview" class="btn btn-small btn-secondary">⛶</button></div></div><div class="editor-error"></div><iframe id="live-preview" title="Live code preview" sandbox="allow-scripts"></iframe></div></div><p class="muted" style="margin-top:18px;font-size:.83rem">Tip: press <span class="kbd">Ctrl + Enter</span> to run or <span class="kbd">Ctrl + S</span> to save. JavaScript errors appear above the preview.</p></div></main><div id="site-footer"></div><script src="../js/storage.js"></script><script src="../js/ui.js"></script><script src="../js/editor.js"></script><script src="../js/playground.js"></script></body></html>
