<!doctype html><html lang="en" data-page="register"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — IBANGA AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><div id="site-header"></div><main class="section"><div class="container" style="max-width:480px"><section class="card card-pad"><span class="eyebrow">START LEARNING</span><h1 style="font-size:2.5rem">Create your account.</h1><p class="muted">Save projects and track your learning progress across devices later.</p><form id="register-form"><div class="form-group"><label for="full_name">Full name</label><input id="full_name" required minlength="2"></div><div class="form-group"><label for="email">Email</label><input id="email" type="email" required></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" required minlength="8"><small class="muted">Use at least 8 characters with letters and numbers.</small></div><div class="form-group"><label for="confirm">Confirm password</label><input id="confirm" type="password" required></div><div id="auth-error" class="notice danger" hidden></div><button class="btn btn-primary" type="submit">Create account ↗</button></form><p class="muted" style="margin-top:18px">Already registered? <a href="login.html" style="color:var(--brand)">Log in</a></p></section></div></main><div id="site-footer"></div><script src="../js/storage.js"></script><script src="../js/api.js"></script><script src="../js/ui.js"></script><script src="../js/auth-api.js"></script></body></html>
